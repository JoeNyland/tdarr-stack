services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr
    container_name: tdarr
    restart: unless-stopped
    networks:
      default:
      proxy:
    environment:
      TZ: Europe/London
      PUID: 991 # media user
      PGID: 994 # media group
      UMASK_SET: 002
      serverIP: "::"
      serverBindIP: true
    labels:
      traefik.enable: true
      traefik.http.routers.tdarr.rule: Host(`tdarr`)
      traefik.http.routers.tdarr.middlewares: trusted-ipallowlist, authentik
    volumes:
      - /containers/tdarr/configs:/app/configs
      - /containers/tdarr/logs:/app/logs
      - /containers/tdarr/server:/app/server
      - /containers/tdarr/work:/work # "Transcode Cache" - Should be excluded from snapshots
      - /tank/media/movies:/tank/media/movies
      - /tank/media/tv:/tank/media/tv
      - /tank/media/xxx/videos:/tank/media/xxx/videos
  tdarr-node:
    image: ghcr.io/haveagitgat/tdarr_node
    container_name: tdarr-node
    restart: unless-stopped
    environment:
      TZ: Europe/London
      PUID: 991 # media user
      PGID: 994 # media group
      UMASK_SET: 002
      nodeName: Server
      serverIP: tdarr
    volumes:
      - /containers/tdarr/configs:/app/configs
      - /containers/tdarr/logs:/app/logs
      - /containers/tdarr/work:/work # "Transcode Cache" - Should be excluded from snapshots
      - /tank/media/movies:/tank/media/movies
      - /tank/media/tv:/tank/media/tv
      - /tank/media/xxx/videos:/tank/media/xxx/videos
    devices:
      - /dev/dri:/dev/dri

networks:
  default:
    enable_ipv6: true
  proxy:
    external: true
